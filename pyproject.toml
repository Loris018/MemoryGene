[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memorygene"
version = "0.2.0.dev2"
description = "DNA-inspired, versioned local memory research core and agent skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Loris018/MemoryGene"
Issues = "https://github.com/Loris018/MemoryGene/issues"

[project.scripts]
memorygene = "memorygene.cli:main"
memorygene-dsh = "memorygene.adapter:main"
memorygene-mcp = "memorygene.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
